version: 2
updates:
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # Major versions are migrated deliberately, not as a monthly bump.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # 0.5 supports flat config only; the repo is on ESLint 8 (.eslintrc).
      # Moves together with the deferred ESLint major migration.
      - dependency-name: 'eslint-plugin-react-refresh'
        versions: ['>=0.5.0']
    groups:
      npm-deps:
        patterns: ['*']
        update-types: ['minor', 'patch']
  - package-ecosystem: docker-compose
    directory: '/infra/docker'
    schedule:
      interval: monthly
    groups:
      compose-images:
        patterns: ['*']
