# File: infra/k8s/namespace.yaml

apiVersion: v1
kind: Namespace
metadata:
  name: chatverse
  labels:
    name: chatverse
    environment: production
    app: chatverse

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chatverse-config
  namespace: chatverse
  labels:
    app: chatverse
data:
  NODE_ENV: "production"
  CORS_ORIGIN: "https://chatverse.com,https://www.chatverse.com"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX: "1000"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  HELMET_ENABLED: "true"
  TRUST_PROXY: "true"
  S3_REGION: "us-east-1"
  PORT: "3001"
