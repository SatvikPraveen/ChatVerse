# File: infra/k8s/ingress.yaml

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chatverse-ingress
  namespace: chatverse
  labels:
    app: chatverse
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://chatverse.com,https://www.chatverse.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Content-Type, Authorization"
    # WebSocket support
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
spec:
  tls:
  - hosts:
    - chatverse.com
    - www.chatverse.com
    - api.chatverse.com
    secretName: chatverse-tls
  rules:
  # Web application
  - host: chatverse.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: chatverse-web-service
            port:
              number: 80
  - host: www.chatverse.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: chatverse-web-service
            port:
              number: 80
  # API endpoints
  - host: api.chatverse.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: chatverse-api-service
            port:
              number: 3001
  # Alternative API path on main domain
  - host: chatverse.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: chatverse-api-service
            port:
              number: 3001
