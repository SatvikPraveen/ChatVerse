# Non-secret configuration for the API. NODE_ID is injected per pod from metadata.name so
# every replica stamps its HLC timestamps and metrics with a stable, unique identifier.
apiVersion: v1
kind: ConfigMap
metadata:
  name: chatverse-api-config
  namespace: chatverse
data:
  NODE_ENV: production
  HOST: '0.0.0.0'
  PORT: '4000'
  ACCESS_TOKEN_TTL_SEC: '900'
  REFRESH_TOKEN_TTL_SEC: '2592000'
  CORS_ORIGINS: https://chat.example.com
  LOG_LEVEL: info
  TRUST_PROXY: '1'
  RATE_LIMIT_WINDOW_SEC: '60'
  RATE_LIMIT_MAX: '300'
  METRICS_ENABLED: 'true'
  S3_REGION: us-east-1
  S3_BUCKET: chatverse-uploads
  S3_PUBLIC_URL: https://uploads.example.com
  VAPID_SUBJECT: mailto:ops@example.com
  MESSAGE_RETENTION_DAYS: '365'
---
# Template only: create the real secret out of band, e.g.
#   kubectl -n chatverse create secret generic chatverse-api-secrets \
#     --from-literal=MONGODB_URI=... --from-literal=REDIS_URL=... \
#     --from-literal=JWT_ACCESS_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=JWT_REFRESH_SECRET="$(openssl rand -hex 32)" ...
# or manage it with External Secrets / Sealed Secrets. Never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: chatverse-api-secrets
  namespace: chatverse
type: Opaque
stringData:
  MONGODB_URI: mongodb://user:password@mongo.example.internal:27017/chatverse?tls=true
  REDIS_URL: rediss://:password@redis.example.internal:6379/0
  JWT_ACCESS_SECRET: replace-with-32-plus-random-bytes
  JWT_REFRESH_SECRET: replace-with-32-plus-random-bytes
  S3_ENDPOINT: https://s3.us-east-1.amazonaws.com
  S3_ACCESS_KEY_ID: replace-me
  S3_SECRET_ACCESS_KEY: replace-me
  VAPID_PUBLIC_KEY: replace-me
  VAPID_PRIVATE_KEY: replace-me
