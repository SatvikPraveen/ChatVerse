apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatverse-web
  namespace: chatverse
  labels:
    app.kubernetes.io/name: chatverse-web
    app.kubernetes.io/part-of: chatverse
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: chatverse-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chatverse-web
        app.kubernetes.io/part-of: chatverse
    spec:
      containers:
        - name: web
          image: ghcr.io/satvikpraveen/chatverse-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: chatverse-web
  namespace: chatverse
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: chatverse-web
  ports:
    - name: http
      port: 80
      targetPort: http
