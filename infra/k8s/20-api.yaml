apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatverse-api
  namespace: chatverse
  labels:
    app.kubernetes.io/name: chatverse-api
    app.kubernetes.io/part-of: chatverse
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: chatverse-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chatverse-api
        app.kubernetes.io/part-of: chatverse
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '4000'
        prometheus.io/path: /metrics
    spec:
      # Graceful drain: the API stops accepting on SIGTERM and lets in-flight sockets close.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: chatverse-api
      containers:
        - name: api
          image: ghcr.io/satvikpraveen/chatverse-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: chatverse-api-config
            - secretRef:
                name: chatverse-api-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: chatverse-api
  namespace: chatverse
  labels:
    app.kubernetes.io/name: chatverse-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: chatverse-api
  ports:
    - name: http
      port: 4000
      targetPort: http
  # Keep a client's long-polling requests on one pod. WebSocket upgrades are pinned to a pod
  # for the connection's lifetime anyway; cross-pod fan-out goes through the Redis adapter.
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: chatverse-api
  namespace: chatverse
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chatverse-api
