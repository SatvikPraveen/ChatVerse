# Load balancer for the bench cluster. ip_hash gives sticky sessions, which Socket.IO needs
# when the long-polling transport is in play (every request of a session must hit the same
# node). WebSocket-only clients would work without it.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream chatverse_api {
    ip_hash;
    server api-1:4000 max_fails=3 fail_timeout=10s;
    server api-2:4000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 80;

    location / {
        proxy_pass http://chatverse_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        client_max_body_size 30m;
    }
}
