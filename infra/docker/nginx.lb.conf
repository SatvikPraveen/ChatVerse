# Load balancer for the bench cluster.
#
# The bench clients connect with the WebSocket transport only, so no session stickiness is
# needed and least_conn spreads the virtual users across both nodes, which is what makes the
# cross-node fan-out through the Redis adapter observable. Production ingresses that must also
# serve the long-polling fallback need sticky sessions (ip_hash here, or a cookie at the
# ingress; see infra/k8s/40-ingress.yaml).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream chatverse_api {
    least_conn;
    server api-1:4000 max_fails=3 fail_timeout=10s;
    server api-2:4000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 80;

    location / {
        proxy_pass http://chatverse_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        client_max_body_size 30m;
    }
}
