# File: infra/docker/docker-compose.dev.yml

version: '3.8'

services:
  # Database
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: chatverse
      MONGO_INITDB_ROOT_PASSWORD: chatverse123
      MONGO_INITDB_DATABASE: chatverse
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - chatverse

  # Cache & Session Store
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass chatverse123
    volumes:
      - redis_data:/data
    networks:
      - chatverse

  # Object Storage (S3 Compatible)
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: chatverse
      MINIO_ROOT_PASSWORD: chatverse123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - chatverse
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Create MinIO bucket
  minio-setup:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set minio http://minio:9000 chatverse chatverse123;
      /usr/bin/mc mb minio/chatverse-uploads;
      /usr/bin/mc policy set public minio/chatverse-uploads;
      exit 0;
      "
    networks:
      - chatverse

  # API Server
  api:
    build:
      context: ../../
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001

      # Database
      MONGODB_URI: mongodb://chatverse:chatverse123@mongo:27017/chatverse?authSource=admin

      # Redis
      REDIS_URL: redis://:chatverse123@redis:6379

      # JWT
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_REFRESH_SECRET: your-super-secret-refresh-key-change-in-production

      # S3/MinIO
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: chatverse-uploads
      S3_ACCESS_KEY: chatverse
      S3_SECRET_KEY: chatverse123
      S3_REGION: us-east-1

      # CORS
      CORS_ORIGIN: http://localhost:3000

      # Push Notifications
      VAPID_PUBLIC_KEY: your-vapid-public-key
      VAPID_PRIVATE_KEY: your-vapid-private-key

      # Rate Limiting
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 100

      # Logging
      LOG_LEVEL: debug
    volumes:
      - ../../apps/api:/app
      - /app/node_modules
    depends_on:
      - mongo
      - redis
      - minio
    networks:
      - chatverse
    develop:
      watch:
        - action: sync
          path: ../../apps/api/src
          target: /app/src
        - action: rebuild
          path: ../../apps/api/package.json

  # Web Frontend
  web:
    build:
      context: ../../
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:3001
      VITE_WS_URL: ws://localhost:3001
      VITE_UPLOAD_MAX_SIZE: 10485760
      VITE_VAPID_PUBLIC_KEY: your-vapid-public-key
    volumes:
      - ../../apps/web:/app
      - /app/node_modules
    depends_on:
      - api
    networks:
      - chatverse
    develop:
      watch:
        - action: sync
          path: ../../apps/web/src
          target: /app/src
        - action: rebuild
          path: ../../apps/web/package.json

  # Monitoring & Observability
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - chatverse

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - chatverse

volumes:
  mongo_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  chatverse:
    driver: bridge
