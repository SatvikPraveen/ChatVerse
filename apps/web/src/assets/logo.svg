<!-- apps/web/src/assets/logo.svg -->
<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- ChatVerse Logo -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main circle background -->
  <circle cx="60" cy="60" r="55" fill="url(#gradient)" stroke="white" stroke-width="4"/>

  <!-- Chat bubble 1 -->
  <g transform="translate(25, 35)">
    <path d="M0 10 Q0 0 10 0 L30 0 Q40 0 40 10 L40 20 Q40 30 30 30 L15 30 L5 40 L10 30 Q0 30 0 20 Z"
          fill="white" fill-opacity="0.9"/>
    <circle cx="12" cy="15" r="2" fill="#3B82F6"/>
    <circle cx="20" cy="15" r="2" fill="#3B82F6"/>
    <circle cx="28" cy="15" r="2" fill="#3B82F6"/>
  </g>

  <!-- Chat bubble 2 -->
  <g transform="translate(55, 55)">
    <path d="M0 10 Q0 0 10 0 L30 0 Q40 0 40 10 L40 20 Q40 30 30 30 L15 30 L5 40 L10 30 Q0 30 0 20 Z"
          fill="white" fill-opacity="0.9"/>
    <circle cx="12" cy="15" r="2" fill="#1D4ED8"/>
    <circle cx="20" cy="15" r="2" fill="#1D4ED8"/>
    <circle cx="28" cy="15" r="2" fill="#1D4ED8"/>
  </g>

  <!-- Connection lines -->
  <line x1="45" y1="50" x2="75" y2="70" stroke="white" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Letter "C" for ChatVerse -->
  <text x="60" y="100" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600"
        fill="white" text-anchor="middle">CV</text>
</svg>
